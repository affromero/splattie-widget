---
name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    build-test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 20

            - run: npm install
            - run: npm run type-check
            - run: npm run test
            - run: npm run build
